<title>Latticework 시사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 한 화면 앱. 화면은 app.js가 그리고, 여기서는 바탕색과 높이, 첫 문구만 잡는다. */
:root { --bg: #f2f4f6; --fg: #191f28; --sub: #6b7684; --focus: #3182f6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101013; --fg: #ffffff; --sub: #9e9ea4; --focus: #3485fa; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #101013; --fg: #ffffff; --sub: #9e9ea4; --focus: #3485fa; color-scheme: dark; }
html { box-sizing: border-box; height: 100%; }
body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#root { display: flex; height: 100%; box-sizing: border-box; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.boot { margin: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: var(--sub); font-size: 15px; }
#root :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#root a { text-decoration: none; color: inherit; }
</style>
<div id="root"><p class="boot">Latticework를 여는 중입니다</p></div>
<script src="app.js" defer></script>
