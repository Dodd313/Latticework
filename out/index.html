<title>Latticework 시사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* 한 화면 앱. 화면은 app.js가 그리고, 여기서는 바탕색과 높이, 첫 문구만 잡는다. */
:root { --bg: #FFFFFF; --fg: #111418; --sub: #4B5563; --focus: #1F4FA8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101214; --fg: #ECEEF1; --sub: #A8B0BB; --focus: #9DB8EA; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #101214; --fg: #ECEEF1; --sub: #A8B0BB; --focus: #9DB8EA; color-scheme: dark; }
html { box-sizing: border-box; height: 100%; }
body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
#root { display: flex; height: 100%; box-sizing: border-box; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.boot { margin: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: var(--sub); font-size: 15px; }
#root :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#root a { text-decoration: none; color: inherit; }
</style>
<div id="root"><p class="boot">Latticework 시사를 여는 중입니다</p></div>
<script src="app.js" defer></script>
